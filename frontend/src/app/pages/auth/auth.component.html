<div class="auth-page">
  <div class="auth-bg">
    <div class="scan-line"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="auth-container" data-reveal>
    <div class="brand">
      <div class="brand-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="4" y="4" width="32" height="32" rx="2" stroke="#00d1ff" stroke-width="1.5"/>
          <path d="M12 28L20 12L28 28M15 23H25" stroke="#00d1ff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="brand-title">jpReader</h1>
      <p class="brand-sub">EPUB &amp; TXT READING SYSTEM</p>
    </div>

    <div class="auth-card">
      <div class="card-header">
        <span class="status-dot"></span>
        <span class="status-text">AUTHENTICATION REQUIRED</span>
      </div>

      <p class="auth-desc">
        Sign in to access your personal reading library.
        Your books and progress are stored locally.
      </p>

      <!-- Primary: local login (no credentials needed) -->
      <button class="btn-local" (click)="loginLocal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>CONTINUE LOCALLY</span>
      </button>

      <div class="auth-divider">
        <div class="divider-line"></div>
        <span>OR</span>
        <div class="divider-line"></div>
      </div>

      <!-- Secondary: Google OAuth (requires credentials in .env) -->
      <button class="btn-google" (click)="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>SIGN IN WITH GOOGLE</span>
      </button>

      <div class="auth-footer">
        <div class="divider-line"></div>
        <span>SECURE · LOCAL · PRIVATE</span>
        <div class="divider-line"></div>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">📖</div>
        <span>EPUB &amp; TXT</span>
      </div>
      <div class="feature">
        <div class="feature-icon">日</div>
        <span>JAPANESE SUPPORT</span>
      </div>
      <div class="feature">
        <div class="feature-icon">⌨</div>
        <span>AI TRANSLATION</span>
      </div>
      <div class="feature">
        <div class="feature-icon">💾</div>
        <span>AUTO PROGRESS</span>
      </div>
    </div>
  </div>
</div>
