services:
  backend:
    build: ./backend
    container_name: jpreader-backend
    env_file: ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost
      - BOOKS_DIR=/app/books
      - DATABASE_URL=sqlite:////app/data/jpreader.db
    volumes:
      - books_data:/app/books
      - db_data:/app/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jpreader-frontend
    ports:
      - "4400:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  tts:
    image: xxxxrt666/gpt-sovits:latest-cu128
    container_name: jpreader-tts
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9874:9874"  # WebUI control panel
      - "9880:9880"  # API server
    volumes:
      - tts_models:/workspace/GPT-SoVITS
    shm_size: "16g"
    working_dir: /workspace/GPT-SoVITS
    command: >
      bash -c "python webui.py & python api_v2.py -a 0.0.0.0 -p 9880 && wait"
    networks:
      - app-net
    restart: unless-stopped

volumes:
  books_data:
  db_data:
  tts_models:

networks:
  app-net:
