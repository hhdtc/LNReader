  # omnivoice-tts:  # OmniVoice (GPU; requires nvidia-container-toolkit)
  #   build: ./omnivoice-tts
  #   container_name: lnreader-omnivoice-tts
  #   runtime: nvidia
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #     - OMNIVOICE_DEVICE=cuda:0
  #   volumes:
  #     - omnivoice_cache:/root/.cache/huggingface
