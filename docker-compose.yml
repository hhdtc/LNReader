services:
  backend:
    build: ./backend
    container_name: lnreader-backend
    env_file: ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost
      - BOOKS_DIR=/app/books
      - DATABASE_URL=sqlite:////app/data/lnreader.db
      # Active TTS engine (must match the uncommented container below):
      #   OmniVoice (GPU): http://lnreader-omnivoice-tts:8765  (default)
      #   OmniVoice (CPU): http://lnreader-omnivoice-tts-cpu:8767
      #   IndexTTS-2.5:    http://lnreader-indextts-tts:8766
      - TTS_URL_BASE=http://lnreader-omnivoice-tts:8765
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - books_data:/app/books
      - db_data:/app/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lnreader-frontend
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── TTS engines ─────────────────────────────────────────────────────────────
  # TTS servers, one active at a time. Active engine is selected in the
  # backend's TTS_URL_BASE env (below). Comment out the containers you are NOT
  # using so only one TTS server runs.
  #
  # Default: OmniVoice (GPU) — `omnivoice-tts` active, CPU/IndexTTS commented.
  #
  # CPU option for IndexTTS-2.5 (slower synthesis):
  #   indextts-tts:
  #     build: ./indextts-tts
  #     container_name: lnreader-indextts-tts
  #     environment:
  #       - INDEXTTS_DEVICE=cpu
  #       - INDEXTTS_LANG=JA
  #       - INDEXTTS_PORT=8766
  #     volumes:
  #       - indextts_checkpoints:/app/checkpoints
  #       - indextts_refaudio:/app/data
  #     networks:
  #       - app-net
  #     restart: unless-stopped
  #
  # GPU option for IndexTTS-2.5 (much faster synthesis; requires nvidia-container-toolkit):
  #   indextts-tts:
  #     build: ./indextts-tts
  #     container_name: lnreader-indextts-tts
  #     runtime: nvidia
  #     environment:
  #       - NVIDIA_VISIBLE_DEVICES=all
  #       - INDEXTTS_DEVICE=cuda:0
  #       - INDEXTTS_LANG=JA
  #       - INDEXTTS_PORT=8766
  #     volumes:
  #       - indextts_checkpoints:/app/checkpoints
