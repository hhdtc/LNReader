services:
  backend:
    build: ./backend
    container_name: jpreader-backend
    env_file: ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost
      - BOOKS_DIR=/app/books
      - DATABASE_URL=sqlite:////app/data/jpreader.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - books_data:/app/books
      - db_data:/app/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jpreader-frontend
    ports:
      - "8080:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

