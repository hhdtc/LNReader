services:
  backend:
    build: ./backend
    container_name: jpreader-backend
    env_file: ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost
      - BOOKS_DIR=/app/books
      - DATABASE_URL=sqlite:///./jpreader.db
    volumes:
      - books_data:/app/books
      - db_data:/app/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jpreader-frontend
    ports:
      - "4400:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  books_data:
  db_data:

networks:
  app-net:
